name: "功能建议"
description: "希望 ReBron 增加或修改的功能"
labels: ["建议"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查项
      options:
        - label: 我已搜索 [现有 Issues](../../issues?q=is%3Aissue)，确认此建议未被提交过。
          required: true
        - label: 我知晓这是修改版启动器，功能建议不保证会被实现；如果是 PCL2 官方功能，建议前往 [官方仓库投票](https://github.com/Meloong-Git/PCL/discussions/2)。
          required: true
  - type: textarea
    id: idea
    attributes:
      label: 建议内容
      description: 希望实现什么功能，解决什么问题。
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: 可能的实现方式（可选）
      description: 如果了解源码结构，可以说明大概改哪里；不了解可以跳过。
    validations:
      required: false
