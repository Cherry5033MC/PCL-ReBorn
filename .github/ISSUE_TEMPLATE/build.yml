name: "构建问题（源码编译失败）"
description: "按 README 步骤从源码构建时报错"
labels: ["构建"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查项
      options:
        - label: 我使用的是本仓库的源码，且未改动过工程文件。
          required: true
        - label: 我已安装 .NET SDK 9 或更高版本（`dotnet --list-sdks` 中有 9.0 及以上）。
          required: true
        - label: 我已按 README 提供了 .NET Framework 4.8 引用程序集（Developer Pack 或 net48ref 方式二选一）。
          required: true
        - label: 我已搜索 [现有 Issues](../../issues?q=is%3Aissue)，确认此问题未被提交过。
          required: true
  - type: dropdown
    id: os
    attributes:
      label: 构建环境
      options:
        - "Windows 10/11（CMD + dotnet msbuild）"
        - "Windows（其他方式）"
        - "Linux"
        - "macOS"
    validations:
      required: true
  - type: textarea
    id: commands
    attributes:
      label: 执行的命令
      description: 完整粘贴你执行的构建命令。
      placeholder: dotnet msbuild "Plain Craft Launcher 2\Plain Craft Launcher 2.vbproj" -p:Configuration=Release ...
    validations:
      required: true
  - type: textarea
    id: error
    attributes:
      label: 报错输出
      description: 粘贴构建输出中**报错部分的最后 30 行左右**即可，不要整屏粘贴。
    validations:
      required: true
  - type: textarea
    id: extra
    attributes:
      label: 补充信息
      description: 对源码的改动、网络代理等任何可能有影响的信息。
    validations:
      required: false
