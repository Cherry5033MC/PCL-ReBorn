name: "Bug 报告（启动器问题）"
description: "ReBron 启动器本身出现崩溃、报错或显示异常"
labels: ["Bug"]
body:
  - type: checkboxes
    id: checklist
    attributes:
      label: 检查项
      description: 请逐个确认后再提交
      options:
        - label: 我确认这是 **ReBron 修改版** 的问题，PCL 官方正式版没有此问题（或不确定）。官方版自身的问题请到 [官方仓库](https://github.com/Meloong-Git/PCL/issues) 反馈。
          required: true
        - label: 我已搜索 [现有 Issues](../../issues?q=is%3Aissue)，确认此问题未被提交过。
          required: true
        - label: 我使用的是本仓库最新构建的版本，而非官方版或其他二次打包版。
          required: true
  - type: textarea
    id: description
    attributes:
      label: 问题描述
      description: 详细描述问题表现，包括在哪个页面、做了什么操作后出现。
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 重现步骤
      description: 让维护者能复现此问题的最小步骤。
      placeholder: |
        1. 打开 XX 页面
        2. 点击 XX
        3. 出现 XX
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 错误报告与日志
      description: |
        崩溃时请上传 PCL 导出的错误报告；没有报告的，上传 PCL 文件夹中的 Log1~5.txt。
        先点击文本框，再将文件拖拽进文本框上传。
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ReBron 版本
      description: "见“关于”页版本行，例如 2.99.0.0"
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: 操作系统
      description: "例如 Windows 11 23H2 / Windows 10 19045"
    validations:
      required: true
